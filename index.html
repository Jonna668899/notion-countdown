<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Countdown Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #ffffff;
      color: #4a3e3e;
    }

    /* 左右分栏外层主卡片 */
    .card {
        display: flex;
        width: 580px;
        height: 250px;
        /* 柔和白粉半透明底色 */
        background: linear-gradient(135deg, #fce8ec 0%, #f7cad0 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        /* 带有温润亮白光泽的细腻边框 */
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        box-shadow: 0 12px 32px rgba(230, 180, 190, 0.25);
        overflow: hidden;
}

    /* 左侧：图片轮播容器 */
    .left-image-section {
      width: 45%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .carousel-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .carousel-img.active {
      opacity: 1;
    }

    /* 右侧：倒计时文字容器 */
    .right-countdown-section {
      width: 55%;
      height: 100%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #8c5b65; /* 优雅的玫瑰灰粉，低调有质感 */
      margin-bottom: 10px;
    }

    .days-wrapper {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 4px 0;
    }

    .days-number {
      font-size: 4.8rem;
      font-weight: 800;
      line-height: 1;
      color: #e63946;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 12px rgba(230, 57, 70, 0.15);
    }

    .days-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #b06d79; /* 柔和的木质粉 */
    }

    .footer {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #9c6b74; /* 底部温润粉标语 */
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 左侧图片轮播 -->
    <div class="left-image-section" id="carousel">
      <!-- 轮播图片列表，可以添加更多 <img> -->
      <img class="carousel-img active" src="./1.jpg" alt="slide 1">
      <img class="carousel-img" src="./2.jpg" alt="slide 2">
    </div>

    <!-- 右侧天数倒计时 -->
    <div class="right-countdown-section">
      <div class="title" id="event-title">小人滚蛋</div>
      
      <div class="days-wrapper">
        <span class="days-number" id="days-count">0</span>
        <span class="days-label">天</span>
      </div>

      <div class="footer" id="event-footer">✨ 每一天都在靠近梦想 ✨</div>
    </div>
  </div>

  <script>
    // ================= 用户配置区 =================
    // 1. 设置目标日期 (年-月-日)
    const TARGET_DATE = "2028-04-01"; 

    // 2. 标题和标语
    const TITLE_TEXT = "距离小人滚蛋还有";
    const FOOTER_TEXT = "✨ 卧薪尝胆，小人快滚！ ✨";

    // 3. 图片轮播间隔（毫秒），例如 3000 表示 3 秒换一张
    const CAROUSEL_INTERVAL = 3000; 
    // =============================================

    document.getElementById("event-title").innerText = TITLE_TEXT;
    document.getElementById("event-footer").innerText = FOOTER_TEXT;

    // --- 倒计天数逻辑 ---
    function updateDays() {
      const target = new Date(TARGET_DATE).getTime();
      const now = new Date().getTime();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById("days-count").innerText = "0";
        document.getElementById("event-footer").innerText = "🎉 目标已达成！";
        return;
      }

      // 计算天数
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById("days-count").innerText = days;
    }

    updateDays();
    // 每天/每小时刷新一次即可，这里设为每分钟更新一次
    setInterval(updateDays, 60000);

    // --- 左侧图片轮播逻辑 ---
    const images = document.querySelectorAll(".carousel-img");
    let currentIndex = 0;

    function rotateImages() {
      if (images.length <= 1) return;
      images[currentIndex].classList.remove("active");
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add("active");
    }

    setInterval(rotateImages, CAROUSEL_INTERVAL);
  </script>
</body>
</html>
